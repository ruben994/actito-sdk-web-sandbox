name: Release SDK

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Outside the actito/actito-sdk-web repository, e.g. in a sandbox copy used for testing, nothing is
  # published to NPM or uploaded to the CDN.
  DRY_RUN: ${{ github.repository != 'actito/actito-sdk-web' }}

  CDN_STABLE_DIR: packages/actito/dist/cdn/stable
  CDN_LATEST_DIR: packages/actito/dist/cdn/latest
  CDN_BUCKET_PATH: libs/web/v5
  NPM_PRERELEASE_DIST_TAG: beta

jobs:
  # Run only for release branches merged into this repository, never for branches from forks.
  validate_branch_version:
    name: Validate the branch version
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/validate-release-branch-version.yml
    with:
      branch: ${{ github.event.pull_request.head.ref }}

  validate_project_versions:
    name: Validate the versions throughout the project
    needs:
      - validate_branch_version
    runs-on: ubuntu-latest
    permissions:
      contents: read    # This is required for actions/checkout

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Validate the versions
        env:
          BRANCH_VERSION: ${{ needs.validate_branch_version.outputs.version }}
        run: |
          FAILED=0

          # Validate lerna.json version
          LERNA_VERSION=$(node -p "require('./lerna.json').version")
          if [ "$LERNA_VERSION" != "$BRANCH_VERSION" ]; then
            echo "::error file=lerna.json::Version $LERNA_VERSION doesn't match $BRANCH_VERSION."
            FAILED=1
          fi

          # Validate each package.json version of every actito package
          for MANIFEST in packages/*/package.json; do
            PACKAGE_VERSION=$(node -p "require('./$MANIFEST').version")
            if [ "$PACKAGE_VERSION" != "$BRANCH_VERSION" ]; then
              echo "::error file=$MANIFEST::Version $PACKAGE_VERSION doesn't match $BRANCH_VERSION."
              FAILED=1
            fi
          done

          # Validate the SDK_VERSION in actito-core
          # The pattern expects the format written by scripts/version.mjs (SDK_VERSION = '<version>')
          SDK_VERSION_FILE=packages/actito-core/src/internal/version.ts
          SDK_VERSION=$(sed -nE "s/.*SDK_VERSION = '([^']+)'.*/\1/p" "$SDK_VERSION_FILE")
          if [ "$SDK_VERSION" != "$BRANCH_VERSION" ]; then
            echo "::error file=$SDK_VERSION_FILE::SDK_VERSION $SDK_VERSION doesn't match $BRANCH_VERSION."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "::notice::Preparing version $BRANCH_VERSION"

  build_and_check:
    name: Build and check SDK
    needs:
      - validate_project_versions
    uses: ./.github/workflows/build-and-check-sdk.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event.pull_request.merge_commit_sha }}
      artifact-name: release-build

  prepare:
    name: Prepare release
    needs:
      - validate_branch_version
      - build_and_check
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # This is required for requesting the JWT (AWS role)
      contents: write   # This is required for actions/checkout and for creating the draft GitHub release
    env:
      VERSION: ${{ needs.validate_branch_version.outputs.version }}
      PRERELEASE: ${{ needs.validate_branch_version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: release-build
          path: packages

      - name: Check the CDN files
        run: |
          FAILED=0

          if [ -z "$(ls -A "$CDN_STABLE_DIR" 2>/dev/null)" ]; then
            echo "::error::$CDN_STABLE_DIR is missing or empty."
            FAILED=1
          fi

          if [ "$PRERELEASE" = "true" ]; then
            echo "::notice::Prerelease: the latest files on the CDN won't be updated."
          elif [ -z "$(ls -A "$CDN_LATEST_DIR" 2>/dev/null)" ]; then
            echo "::error::$CDN_LATEST_DIR is missing or empty."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Preview the NPM packages
        env:
          NPM_CONFIG_DRY_RUN: true
        run: |
          set -o pipefail
          yarn lerna publish from-package --yes --pre-dist-tag "${NPM_PRERELEASE_DIST_TAG:?}" 2>&1 | tee "$RUNNER_TEMP/npm-preview.log"

          if [ "$PRERELEASE" = "true" ]; then
            DIST_TAG="$NPM_PRERELEASE_DIST_TAG"
          else
            DIST_TAG=latest
          fi

          {
            echo "# Release $VERSION"
            echo
            echo "## NPM"
            echo
            echo "Dist-tag: \`$DIST_TAG\`"
            echo
            echo '```'
            sed -n '/^Found [0-9]* package/,/^$/p' "$RUNNER_TEMP/npm-preview.log"
            echo '```'
            echo
            echo "<details><summary>Package contents</summary>"
            echo
            echo '```'
            grep '^lerna notice' "$RUNNER_TEMP/npm-preview.log" | grep -v '^lerna notice cli ' | sed 's/^lerna notice //' || true
            echo '```'
            echo
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Authenticate with AWS
        if: env.DRY_RUN != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Preview the CDN upload
        env:
          BUCKET_NAME: ${{ secrets.CDN_BUCKET_NAME }}
        run: |
          set -o pipefail

          # Usage: preview_sync <local folder> <bucket path> [extra aws s3 sync options]
          # A dry run has no access to the bucket, so every local file is listed as an upload.
          preview_sync() {
            if [ "$DRY_RUN" = "true" ]; then
              find "$1" -type f | sort | sed "s|^$1/\(.*\)$|(dryrun) upload: $1/\1 to $2\1|"
            else
              aws s3 sync "$1" "s3://$BUCKET_NAME/$2" --dryrun "${@:3}" | sed "s|s3://$BUCKET_NAME/||"
            fi
          }

          {
            echo "## CDN"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: without access to the bucket, every built file is listed as an upload."
              echo
            fi
            echo "### \`$CDN_BUCKET_PATH/$VERSION/\`"
            echo
            echo '```'
            preview_sync "$CDN_STABLE_DIR" "$CDN_BUCKET_PATH/$VERSION/"
            echo '```'
            echo

            if [ "$PRERELEASE" = "true" ]; then
              echo "\`$CDN_BUCKET_PATH/latest/\` won't be updated, because $VERSION is a prerelease."
            else
              echo "### \`$CDN_BUCKET_PATH/latest/\`"
              echo
              echo '```'
              preview_sync "$CDN_LATEST_DIR" "$CDN_BUCKET_PATH/latest/" --delete
              echo '```'
              echo
              echo "CloudFront invalidation: \`/$CDN_BUCKET_PATH/latest/*\`"
            fi
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The tag is only created when the draft is published, after the approval.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          # The release notes are the contents of the "## <version>" section of the CHANGELOG.md.
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if ! grep -qxF "## $VERSION" CHANGELOG.md; then
            echo "::warning file=CHANGELOG.md::The CHANGELOG.md has no \"## $VERSION\" section."
          elif [ -z "$(tr -d '[:space:]' < "$NOTES_FILE")" ]; then
            echo "::warning file=CHANGELOG.md::The \"## $VERSION\" section of the CHANGELOG.md is empty."
          fi

          # Check if there is already a GitHub Release with the current version.
          if gh release view "$VERSION" > /dev/null 2>&1; then
            # If it is a draft, update its notes and prerelease flag, and
            # point it to the new merge commit.
            if [ "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$VERSION" --target "$TARGET" --prerelease="$PRERELEASE" --notes-file "$NOTES_FILE"
            else
              # Otherwise, show an error. Releasing it again would overwrite the CDN files of a released version.
              echo "::error::The GitHub release $VERSION is already published. Use a new version."
              exit 1
            fi
          else
            # Otherwise, create it as a draft.
            gh release create "$VERSION" --draft --target "$TARGET" --title "$VERSION" \
              --prerelease="$PRERELEASE" --notes-file "$NOTES_FILE"
          fi

          # Link the draft and the commit its tag will point to in the run summary.
          RELEASE_URL=$(gh release view "$VERSION" --json url --jq .url)
          COMMIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$TARGET"
          if [ "$PRERELEASE" = "true" ]; then
            KIND=beta
          else
            KIND=stable
          fi

          {
            echo "## GitHub release"
            echo
            echo "**Draft release:** [$VERSION]($RELEASE_URL) · $KIND · tag will point to [\`${TARGET:0:7}\`]($COMMIT_URL)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Waits for a reviewer to approve the "release" environment before publishing.
  publish:
    name: Publish release
    needs:
      - validate_branch_version
      - prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write   # This is required for requesting the JWT (AWS role and NPM trusted publishing)
      contents: write   # This is required for actions/checkout and for publishing the GitHub release
    env:
      VERSION: ${{ needs.validate_branch_version.outputs.version }}
      PRERELEASE: ${{ needs.validate_branch_version.outputs.prerelease }}

    steps:
      - name: Announce the dry run
        if: env.DRY_RUN == 'true'
        run: echo "::notice::Dry run in $GITHUB_REPOSITORY. Nothing is published to NPM or uploaded to the CDN."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Node and install dependencies
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      # NPM trusted publishing requires npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@11

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: release-build
          path: packages

      - name: Publish to NPM
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            export NPM_CONFIG_DRY_RUN=true
          fi

          yarn lerna publish from-package --yes --pre-dist-tag "${NPM_PRERELEASE_DIST_TAG:?}"

      - name: Authenticate with AWS
        if: env.DRY_RUN != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload the versioned files to the CDN
        if: env.DRY_RUN != 'true'
        env:
          BUCKET_NAME: ${{ secrets.CDN_BUCKET_NAME }}
        run: aws s3 sync "$CDN_STABLE_DIR" "s3://$BUCKET_NAME/$CDN_BUCKET_PATH/$VERSION/"

      - name: Upload the latest files to the CDN
        if: env.DRY_RUN != 'true' && env.PRERELEASE == 'false'
        env:
          BUCKET_NAME: ${{ secrets.CDN_BUCKET_NAME }}
        run: aws s3 sync "$CDN_LATEST_DIR" "s3://$BUCKET_NAME/$CDN_BUCKET_PATH/latest/" --delete

      - name: Invalidate the latest files in CloudFront
        if: env.DRY_RUN != 'true' && env.PRERELEASE == 'false'
        env:
          DISTRIBUTION_ID: ${{ secrets.CDN_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/$CDN_BUCKET_PATH/latest/*"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$VERSION" --draft=false
